name: Deploy Schulung auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Ordner "project" als Webseite verpacken
        uses: actions/upload-pages-artifact@v3
        with:
          path: project

      - name: Veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
